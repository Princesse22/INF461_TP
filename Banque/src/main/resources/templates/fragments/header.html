<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<header th:fragment="header">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <!-- Logo et nom du site -->
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-landmark me-2"></i>
                <span class="fw-bold">Banque</span>
            </a>
            
            <!-- Bouton hamburger pour mobile -->
            <button class="navbar-toggler" type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Menu principal -->
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto">
                    <!-- Accueil -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" 
                           th:classappend="${#httpServletRequest.requestURI == '/'} ? 'active' : ''">
                            <i class="fas fa-home me-1"></i> Accueil
                        </a>
                    </li>
                    
                    <!-- Dashboard (visible si connecté) -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/dashboard}"
                           th:classappend="${#httpServletRequest.requestURI == '/dashboard'} ? 'active' : ''">
                            <i class="fas fa-tachometer-alt me-1"></i> Tableau de bord
                        </a>
                    </li>
                    
                    <!-- Transactions -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/transactions}"
                           th:classappend="${#httpServletRequest.requestURI == '/transactions'} ? 'active' : ''">
                            <i class="fas fa-exchange-alt me-1"></i> Transactions
                        </a>
                    </li>
                    
                    <!-- Comptes -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/comptes}"
                           th:classappend="${#httpServletRequest.requestURI == '/comptes'} ? 'active' : ''">
                            <i class="fas fa-wallet me-1"></i> Mes comptes
                        </a>
                    </li>
                    
                    <!-- Admin Panel (visible seulement pour ADMIN) -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin}"
                           th:classappend="${#httpServletRequest.requestURI == '/admin'} ? 'active' : ''">
                            <i class="fas fa-cogs me-1"></i> Administration
                        </a>
                    </li>
                </ul>
                
                <!-- Menu utilisateur à droite -->
                <ul class="navbar-nav ms-auto">
                    <!-- Si NON connecté -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt me-1"></i> Connexion
                        </a>
                    </li>
                    
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link btn btn-outline-light btn-sm ms-2" 
                           th:href="@{/register}">
                            <i class="fas fa-user-plus me-1"></i> S'inscrire
                        </a>
                    </li>
                    
                    <!-- Si connecté : menu déroulant utilisateur -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" 
                           id="userDropdown" role="button" 
                           data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span sec:authentication="name">Utilisateur</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="fas fa-user me-2"></i> Mon profil
                            </a>
                            <a class="dropdown-item" th:href="@{/settings}">
                                <i class="fas fa-cog me-2"></i> Paramètres
                            </a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" th:href="@{/logout}">
                                <i class="fas fa-sign-out-alt me-2"></i> Déconnexion
                            </a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Espace pour que le contenu ne soit pas caché par la navbar fixed -->
    <div style="height: 80px;"></div>
</header>
