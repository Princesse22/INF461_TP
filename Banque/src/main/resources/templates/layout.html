<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <!-- Métadonnées -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Titre de la page (sera remplacé par chaque page) -->
    <title th:text="${pageTitle} + ' - BankingSystem'">BankingSystem</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    
    <!-- Bootstrap 5 + Bootswatch Minty Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/minty/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Personnalisé -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    
    <!-- CSS supplémentaire spécifique à la page -->
    <th:block th:if="${pageCss}">
        <link rel="stylesheet" th:href="${pageCss}">
    </th:block>
    
    <!-- Style inline pour les surcharges -->
    <th:block th:if="${inlineCss}">
        <style th:utext="${inlineCss}"></style>
    </th:block>
</head>

<!-- Ajouter des classes CSS conditionnelles au body -->
<body th:classappend="${bodyClass} ?: 'default-body'"
      th:attr="data-page=${#httpServletRequest.requestURI}">
    
    <!-- Container pour les notifications (toasts) -->
    <div th:replace="fragments/navigation :: alerts"></div>
    
    <!-- Header (navbar) -->
    <header th:replace="fragments/header :: header"></header>
    
    <!-- Contenu principal -->
    <main role="main" class="flex-grow-1">
        <!-- Container principal -->
        <div class="container-fluid" th:if="${hasSidebar}">
            <div class="row">
                <!-- Sidebar (si nécessaire) -->
                <div class="col-md-3 col-lg-2 d-none d-md-block" th:if="${hasSidebar}">
                    <div th:replace="fragments/navigation :: sidebar"></div>
                </div>
                
                <!-- Contenu de la page -->
                <div class="col-md-9 col-lg-10 ms-sm-auto px-md-4">
                    <!-- Fil d'Ariane (breadcrumb) -->
                    <div th:replace="fragments/navigation :: breadcrumb"></div>
                    
                    <!-- Messages flash (erreurs, succès) -->
                    <div th:if="${#ctx.containsVariable('flashMessage')}">
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${flashMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    </div>
                    
                    <!-- Contenu spécifique à la page (sera inséré ici) -->
                    <div th:replace="${content} ?: ~{::content}"></div>
                </div>
            </div>
        </div>
        
        <!-- Container simple (sans sidebar) -->
        <div class="container" th:unless="${hasSidebar}">
            <!-- Messages flash -->
            <div th:if="${#ctx.containsVariable('flashMessage')}">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${flashMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            </div>
            
            <!-- Contenu spécifique à la page -->
            <div th:replace="${content} ?: ~{::content}"></div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer th:replace="fragments/footer :: footer"></footer>
    
    <!-- Scripts JavaScript -->
    <div th:replace="fragments/footer :: scripts"></div>
    
    <!-- Scripts personnalisés -->
    <script th:src="@{/js/app.js}"></script>
    
    <!-- Scripts spécifiques à la page -->
    <th:block th:if="${pageScripts}">
        <script th:src="${pageScripts}"></script>
    </th:block>
    
    <!-- Script inline -->
    <th:block th:if="${inlineScript}">
        <script th:utext="${inlineScript}"></script>
    </th:block>
    
    <!-- Initialisation de l'application -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialiser l'application JavaScript
            if (typeof BankingApp !== 'undefined') {
                BankingApp.init();
            }
            
            // Démarrer les animations
            const animatedElements = document.querySelectorAll('[data-animate]');
            animatedElements.forEach(el => {
                const animation = el.getAttribute('data-animate');
                el.classList.add('animate__animated', `animate__${animation}`);
            });
        });
    </script>
</body>
</html>
